[package]
name = "agent-reach"
version = "0.1.0"
edition = "2021"
description = "Cross-platform content reach router/selector/installer/doctor (incl. Zhihu/Taobao/JD)."
license = "MIT"
repository = "https://github.com/xyzln/agent-reach"

[[bin]]
name = "agent-reach"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
